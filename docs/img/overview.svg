<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif">
<title id="title">Choose, adjust, generate — Krea2 Rebalance 2.1</title>
<desc id="desc">Enable checked bypasses, select one or more of Fedor, Filter Bypass 2, Filter Bypass 3 and bounded Enhancer, start at strength one, then use native Forge Generate. Higher combined strength may change appearance. Validation: 46 automated tests and 32 native API generations; image quality is not guaranteed.</desc>
<rect width="960" height="540" rx="24" fill="#101e29"/>
<text x="40" y="51" fill="#f0f6fa" font-size="28" font-weight="700">Choose. Adjust. Generate.</text>
<text x="40" y="81" fill="#a9becb" font-size="16">A compact panel that keeps the normal Forge workflow.</text>
<g fill="#17313b" stroke="#31505b"><rect x="40" y="110" width="280" height="302" rx="16"/><rect x="340" y="110" width="280" height="302" rx="16"/><rect x="640" y="110" width="280" height="302" rx="16"/></g>
<g fill="#65dccb" font-size="18" font-weight="700"><text x="60" y="146">01 · SELECT</text><text x="360" y="146">02 · FINE-TUNE</text><text x="660" y="146">03 · GENERATE</text></g>
<g fill="#e0eaf0" font-size="17"><text x="60" y="185">Enable checked bypasses</text><text x="360" y="185">Start with one method</text><text x="360" y="219">Method strength: 1.0</text><text x="360" y="267">Add installed LoRAs</text><text x="360" y="301">by name, when needed</text><text x="660" y="185">Use Forge Generate</text><text x="660" y="219">Save to the normal gallery</text><text x="660" y="267">Settings recorded in PNG</text><text x="660" y="301">Reset clears selections</text></g>
<g fill="#10252b" stroke="#39c6b4"><rect x="60" y="206" width="240" height="36" rx="8"/><rect x="60" y="250" width="240" height="36" rx="8"/><rect x="60" y="294" width="240" height="36" rx="8"/><rect x="60" y="338" width="240" height="36" rx="8"/></g>
<g fill="#dbf6f0" font-size="16"><text x="74" y="230">✓ Fedor (layers 9 + 10)</text><text x="74" y="274">✓ Filter Bypass 2</text><text x="74" y="318">✓ Filter Bypass 3</text><text x="74" y="362">✓ Enhancer (bounded)</text></g>
<text x="360" y="366" fill="#f1ca87" font-size="14">Combined effects can alter appearance.</text>
<text x="40" y="455" fill="#65dccb" font-size="18" font-weight="700">46 automated tests · 32 native API generations · UI save/gallery check</text>
<text x="40" y="486" fill="#a9becb" font-size="15">Execution and cleanup verified on Krea2 Turbo INT8 / RTX 5090.</text>
<text x="40" y="512" fill="#a9becb" font-size="15">These checks do not guarantee bypass effectiveness or halo-free images.</text>
