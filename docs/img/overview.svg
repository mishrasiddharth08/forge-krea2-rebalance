<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif">
<title id="title">Krea2 Rebalance — how the extension works</title>
<desc id="desc">Pipeline overview: the prompt passes through the txtfusion enhancer with a correction limit, optional refusal LoRA and selective Avoid, then into sampling with a bounded text-conditioning delta.</desc>
<defs>
  <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/>
    <stop offset="1" stop-color="#1a1128"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#a371f7"/>
  </marker>
</defs>
<rect width="960" height="470" rx="12" fill="url(#bg2)" stroke="#30363d"/>
<text x="480" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">How Krea2 Rebalance works</text>

<!-- stage 1 -->
<rect x="50" y="80" width="200" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="150" y="112" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6edf3">Your prompt</text>
<text x="150" y="134" text-anchor="middle" font-size="11.5" fill="#8b949e">normal Forge prompt box</text>

<!-- stage 2: txtfusion -->
<rect x="310" y="70" width="240" height="100" rx="10" fill="#1c2128" stroke="#a371f7"/>
<text x="430" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a371f7">Txtfusion enhancer</text>
<text x="430" y="120" text-anchor="middle" font-size="11.5" fill="#e6edf3">12 tapped Qwen3-VL layers</text>
<text x="430" y="140" text-anchor="middle" font-size="11.5" fill="#8b949e">preset · power mode · cache</text>
<line x1="250" y1="120" x2="306" y2="120" stroke="#a371f7" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- correction limit -->
<rect x="310" y="190" width="240" height="72" rx="10" fill="#161b22" stroke="#3fb950"/>
<text x="430" y="218" text-anchor="middle" font-size="13" font-weight="600" fill="#3fb950">Correction limit (cap)</text>
<text x="430" y="240" text-anchor="middle" font-size="11.5" fill="#8b949e">bounds the delta per token —</text>
<text x="430" y="256" text-anchor="middle" font-size="11.5" fill="#8b949e">prevents washed-out / halo drift</text>
<line x1="430" y1="170" x2="430" y2="186" stroke="#a371f7" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- stage 3: optional adapters -->
<rect x="620" y="70" width="290" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="765" y="98" text-anchor="middle" font-size="13.5" font-weight="600" fill="#58a6ff">Optional add-ons</text>
<text x="765" y="122" text-anchor="middle" font-size="11.5" fill="#e6edf3">· refusal-reduction LoRA adapter</text>
<text x="765" y="144" text-anchor="middle" font-size="11.5" fill="#e6edf3">· selective Avoid (concept suppression)</text>
<text x="765" y="164" text-anchor="middle" font-size="11.5" fill="#8b949e">LoRAs stay on the runtime side path</text>
<line x1="550" y1="120" x2="616" y2="120" stroke="#a371f7" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- stage 4: sampling -->
<rect x="620" y="290" width="290" height="86" rx="10" fill="#161b22" stroke="#d29922"/>
<text x="765" y="318" text-anchor="middle" font-size="13.5" font-weight="600" fill="#d29922">Krea 2 sampling</text>
<text x="765" y="340" text-anchor="middle" font-size="11.5" fill="#8b949e">normal Forge Generate · seed · batch</text>
<text x="765" y="360" text-anchor="middle" font-size="11.5" fill="#8b949e">nonfinite tokens recovered + reported</text>
<line x1="765" y1="170" x2="765" y2="286" stroke="#a371f7" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- safeguards box -->
<rect x="50" y="290" width="500" height="86" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="70" y="316" font-size="13" font-weight="600" fill="#3fb950">BUILT-IN SAFEGUARDS</text>
<text x="70" y="340" font-size="11.5" fill="#e6edf3">✓ bounded correction (no takeover of text conditioning)</text>
<text x="70" y="362" font-size="11.5" fill="#e6edf3">✓ stats reported per run: fusion passes · cache hits · recovered tokens</text>

<!-- bottom note -->
<text x="480" y="430" text-anchor="middle" font-size="11" fill="#8b949e">Krea 2 models are auto-detected · no Forge core edits · delete the folder to return to stock</text>
<line x1="550" y1="333" x2="616" y2="333" stroke="#a371f7" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>
