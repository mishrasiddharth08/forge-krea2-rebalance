<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif">
<title id="title">Krea2 Rebalance 2.1 — simple controls, more choice</title>
<desc id="desc">Native Forge Neo extension with named bypass checkboxes, multiple LoRAs, bounded prompt controls and a symmetrical interface.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10252b"/><stop offset="1" stop-color="#101827"/></linearGradient></defs>
<rect width="960" height="240" rx="24" fill="url(#bg)"/>
<rect x="32" y="32" width="5" height="176" rx="2" fill="#39c6b4"/>
<text x="60" y="60" fill="#65dccb" font-size="15" letter-spacing="3">NATIVE FORGE NEO · VERSION 2.1</text>
<text x="60" y="112" fill="#f2f7fa" font-size="42" font-weight="700">Krea2 Rebalance</text>
<text x="60" y="148" fill="#c1d0db" font-size="20">Simple controls. Named choices. A cleaner workflow.</text>
<g fill="#17383f" stroke="#32606b"><rect x="60" y="178" width="260" height="36" rx="10"/><rect x="340" y="178" width="260" height="36" rx="10"/><rect x="620" y="178" width="280" height="36" rx="10"/></g>
<g fill="#dbf6f0" font-size="15" text-anchor="middle"><text x="190" y="202">One or multiple bypasses</text><text x="470" y="202">Searchable installed LoRAs</text><text x="760" y="202">Native Generate + gallery</text></g>
</svg>
